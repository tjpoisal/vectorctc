name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is end-of-life and lacks the stable permission model the behaviour sandbox needs; 20.11+ is the floor.
        node: [20, 22, 24]
        os: [ubuntu-latest]
        include:
          - node: 22
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Package smoke test
        run: |
          npm pack --silent
          mkdir -p /tmp/ctc-smoke && cd /tmp/ctc-smoke && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/vectorctc-*.tgz
          npx --no-install ctc --version
          npx --no-install ctc --help >/dev/null

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
