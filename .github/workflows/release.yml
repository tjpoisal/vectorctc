# Publishes to npm with provenance. Manual only: it never runs on push.
# Before the first run: create the npm package/owner, add the NPM_TOKEN repository secret (or configure npm
# trusted publishing for this repo/workflow and drop the token line), and bump "version" in package.json.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish --dry-run only"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
